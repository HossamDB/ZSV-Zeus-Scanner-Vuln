<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ZSV - Zeus Scanner Vuln">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3987e5"/>
      <stop offset="100%" stop-color="#199e70"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3987e5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2c2c2a" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1280" height="640" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>
    <circle cx="1040" cy="150" r="340" fill="url(#glow)"/>
    <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

    <!-- Shield + scan glyph, original geometric mark (no external logo) -->
    <g transform="translate(120,208)">
      <path d="M112 0 L214 40 V132 C214 208 168 258 112 284 C56 258 10 208 10 132 V40 Z"
            fill="none" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="112" cy="126" r="46" fill="none" stroke="#e66767" stroke-width="8"/>
      <line x1="146" y1="160" x2="182" y2="196" stroke="#e66767" stroke-width="10" stroke-linecap="round"/>
      <path d="M92 126 L106 140 L136 108" fill="none" stroke="#3987e5" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Wordmark -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <text x="400" y="290" font-size="150" font-weight="700" fill="#ffffff" letter-spacing="2">ZSV</text>
      <text x="404" y="330" font-size="30" font-weight="600" fill="#c3c2b7" letter-spacing="6">ZEUS SCANNER VULN</text>
      <text x="404" y="378" font-size="22" font-weight="400" fill="#898781">Defensive security scanning for authorized targets</text>

      <!-- Feature chips -->
      <g font-size="19" font-weight="600">
        <g transform="translate(404,430)">
          <rect width="118" height="42" rx="21" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
          <text x="59" y="27" text-anchor="middle" fill="#3987e5">NMAP</text>
        </g>
        <g transform="translate(536,430)">
          <rect width="118" height="42" rx="21" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
          <text x="59" y="27" text-anchor="middle" fill="#199e70">NIKTO</text>
        </g>
        <g transform="translate(668,430)">
          <rect width="108" height="42" rx="21" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
          <text x="54" y="27" text-anchor="middle" fill="#e66767">XSS</text>
        </g>
        <g transform="translate(790,430)">
          <rect width="178" height="42" rx="21" fill="none" stroke="#2c2c2a" stroke-width="1.5"/>
          <text x="89" y="27" text-anchor="middle" fill="#c98500">FREE NVD CVE DATA</text>
        </g>
      </g>

      <text x="404" y="520" font-size="17" fill="#52514e">100% free &amp; open-source engines &#183; SQLite-backed &#183; self-contained HTML reports</text>
    </g>
  </g>
</svg>
